name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-mini-project

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 app.py test_app.py --max-line-length=100

      - name: Run unit tests
        run: pytest -v

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Smoke test the container
        run: |
          docker run -d --name tm -p 5000:5000 $IMAGE_NAME:latest
          sleep 5
          curl --fail http://localhost:5000/health
          docker rm -f tm

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push $IMAGE_NAME:latest

      - name: Trigger Render deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
